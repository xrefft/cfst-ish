name: Publish tested iSH preview
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish previously tested binary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: xrefft/cfst-ish
        run: |
          set -eu
          test "$(gh run view 41199528578 --json conclusion --jq .conclusion)" = success
          gh run download 41199528578 -n cfst-ish-linux-386 -D package
          cd package
          sha256sum -c SHA256SUMS
          gh release upload v0.2.0-ish.1 cfst-ish-linux-386.tar.gz SHA256SUMS

